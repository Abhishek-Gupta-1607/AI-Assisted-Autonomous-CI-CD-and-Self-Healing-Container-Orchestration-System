name: Java CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Build User Service
      run: cd user-service && ./mvnw clean install -DskipTests

    - name: Build Product Service
      run: cd product-service && ./mvnw clean install -DskipTests

    - name: Build Order Service
      run: cd order-service && ./mvnw clean install -DskipTests

    - name: Verify Docker Compose Architecture
      run: docker-compose config
